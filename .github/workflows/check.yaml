name: Github Action for checking Norminette, Compiling Process and Memory Leaks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  
jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Set up a C Compiler
        run: |
          sudo apt-get update
          sudp apt-get install -y gcc make
      - name: Compiling Process
        run:
          make

