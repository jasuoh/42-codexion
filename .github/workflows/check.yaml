name: Github Action for checking Norminette, Compiling Process and Memory Leaks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y valgrind
          pipx install norminette

      - name: Norminette
        run: norminette coders

      - name: Compile
        run: make -C coders

      - name: Valgrind
        working-directory: coders
        run: |
          valgrind --leak-check=full --show-leak-kinds=all \
            --errors-for-leak-kinds=all --error-exitcode=1 \
            ./codexion 2 2000 200 200 200 2 100 fifo